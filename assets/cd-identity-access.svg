<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Identity and Access Management Bounded Context Class Diagram</title>
  <desc id="description">Diagrama UML de clases para el contexto de identidad y acceso.</desc>
  <rect width="1400" height="1000" fill="#FFFFFF"/>
  <text x="700" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000">TechnoLoad - Identity &amp; Access Management Bounded Context Class Diagram</text>
  <!-- Service -->
  <g><rect x="40" y="80" width="315" height="300" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="40" y="80" width="315" height="32" fill="#E8F2FF"/><text x="197" y="101" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">IdentityAccessService</text><text x="197" y="128" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Application Service»</text><path d="M40 140H355" stroke="#1D2939"/><text x="55" y="165" font-family="sans-serif" font-size="12" fill="#171A20">+ registerUser()</text><text x="55" y="187" font-family="sans-serif" font-size="12" fill="#171A20">+ authenticateUser()</text><text x="55" y="209" font-family="sans-serif" font-size="12" fill="#171A20">+ assignRole()</text><text x="55" y="231" font-family="sans-serif" font-size="12" fill="#171A20">+ removeRole()</text><text x="55" y="253" font-family="sans-serif" font-size="12" fill="#171A20">+ changePassword()</text><text x="55" y="275" font-family="sans-serif" font-size="12" fill="#171A20">+ activate() · + suspend()</text><text x="55" y="297" font-family="sans-serif" font-size="12" fill="#171A20">+ hasRole(): Boolean</text></g>
  <!-- Repository -->
  <g><rect x="40" y="470" width="315" height="210" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="40" y="470" width="315" height="32" fill="#F2F4F7"/><text x="197" y="491" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">UserAccountRepository</text><text x="197" y="518" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Interface»</text><path d="M40 530H355" stroke="#1D2939"/><text x="55" y="555" font-family="sans-serif" font-size="12" fill="#171A20">+ save(userAccount)</text><text x="55" y="578" font-family="sans-serif" font-size="12" fill="#171A20">+ findById(id)</text><text x="55" y="601" font-family="sans-serif" font-size="12" fill="#171A20">+ findByEmail(email)</text><text x="55" y="624" font-family="sans-serif" font-size="12" fill="#171A20">+ existsByEmail(email): Boolean</text></g>
  <!-- Aggregate -->
  <g><rect x="500" y="170" width="360" height="390" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="500" y="170" width="360" height="32" fill="#FFF3C4"/><text x="680" y="191" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#171A20">UserAccount</text><text x="680" y="218" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Aggregate Root»</text><path d="M500 230H860" stroke="#1D2939"/><text x="516" y="254" font-family="sans-serif" font-size="12" fill="#171A20">- id: UUID</text><text x="516" y="276" font-family="sans-serif" font-size="12" fill="#171A20">- email: String</text><text x="516" y="298" font-family="sans-serif" font-size="12" fill="#171A20">- credential: Credential</text><text x="516" y="320" font-family="sans-serif" font-size="12" fill="#171A20">- status: AccountStatus</text><text x="516" y="342" font-family="sans-serif" font-size="12" fill="#171A20">- roles: Set&lt;Role&gt;</text><text x="516" y="364" font-family="sans-serif" font-size="12" fill="#171A20">- createdAt: LocalDateTime</text><text x="516" y="386" font-family="sans-serif" font-size="12" fill="#171A20">- lastLoginAt: LocalDateTime</text><path d="M500 400H860" stroke="#1D2939"/><text x="516" y="424" font-family="sans-serif" font-size="12" fill="#171A20">+ activate() · + suspend()</text><text x="516" y="446" font-family="sans-serif" font-size="12" fill="#171A20">+ assignRole() · + removeRole()</text><text x="516" y="468" font-family="sans-serif" font-size="12" fill="#171A20">+ changePassword()</text><text x="516" y="490" font-family="sans-serif" font-size="12" fill="#171A20">+ hasRole(): Boolean</text></g>
  <!-- Credential -->
  <g><rect x="1010" y="115" width="300" height="190" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="1010" y="115" width="300" height="32" fill="#E8F7ED"/><text x="1160" y="136" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">Credential</text><text x="1160" y="163" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Value Object»</text><path d="M1010 175H1310" stroke="#1D2939"/><text x="1026" y="199" font-family="sans-serif" font-size="12" fill="#171A20">- passwordHash: String</text><text x="1026" y="221" font-family="sans-serif" font-size="12" fill="#171A20">- changedAt: LocalDateTime</text><path d="M1010 233H1310" stroke="#1D2939"/><text x="1026" y="257" font-family="sans-serif" font-size="12" fill="#171A20">+ matches(): Boolean</text><text x="1026" y="279" font-family="sans-serif" font-size="12" fill="#171A20">+ update()</text></g>
  <!-- Role -->
  <g><rect x="1010" y="380" width="300" height="200" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="1010" y="380" width="300" height="32" fill="#FFF3C4"/><text x="1160" y="401" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">Role</text><text x="1160" y="428" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Entity»</text><path d="M1010 440H1310" stroke="#1D2939"/><text x="1026" y="464" font-family="sans-serif" font-size="12" fill="#171A20">- id: UUID</text><text x="1026" y="486" font-family="sans-serif" font-size="12" fill="#171A20">- name: RoleName</text><text x="1026" y="508" font-family="sans-serif" font-size="12" fill="#171A20">- description: String</text><path d="M1010 520H1310" stroke="#1D2939"/><text x="1026" y="546" font-family="sans-serif" font-size="12" fill="#171A20">+ isAdministrative(): Boolean</text></g>
  <!-- Enums -->
  <g><rect x="500" y="680" width="300" height="170" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="500" y="680" width="300" height="32" fill="#F2F4F7"/><text x="650" y="701" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">AccountStatus</text><text x="650" y="728" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Enum»</text><path d="M500 740H800" stroke="#1D2939"/><text x="516" y="765" font-family="sans-serif" font-size="12" fill="#171A20">PENDING · ACTIVE</text><text x="516" y="788" font-family="sans-serif" font-size="12" fill="#171A20">SUSPENDED · DISABLED</text></g>
  <g><rect x="1010" y="670" width="330" height="200" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="1010" y="670" width="330" height="32" fill="#F2F4F7"/><text x="1175" y="691" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">RoleName</text><text x="1175" y="718" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Enum»</text><path d="M1010 730H1340" stroke="#1D2939"/><text x="1026" y="754" font-family="sans-serif" font-size="11" fill="#171A20">CONTRACTOR · FLEET_OWNER</text><text x="1026" y="775" font-family="sans-serif" font-size="11" fill="#171A20">FLEET_ADMINISTRATOR · OPERATOR</text><text x="1026" y="796" font-family="sans-serif" font-size="11" fill="#171A20">SYSTEM_ADMINISTRATOR</text></g>
  <!-- UML relations -->
  <path d="M355 230L500 290" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="5"/><path d="M500 290l-11-1 7-8z" fill="#344054"/><text x="365" y="245" font-family="sans-serif" font-size="11" fill="#344054">uses</text>
  <path d="M355 575L500 420" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="5"/><path d="M500 420l-5-10 10 4z" fill="#344054"/><text x="374" y="505" font-family="sans-serif" font-size="11" fill="#344054">persists</text>
  <path d="M860 290H980" fill="none" stroke="#344054" stroke-width="2"/><path d="M880 290l14-10 14 10-14 10z" fill="#171A20"/><text x="900" y="280" font-family="sans-serif" font-size="11" fill="#344054">owns 1</text>
  <path d="M860 440H980" fill="none" stroke="#344054" stroke-width="2"/><path d="M880 440l14-10 14 10-14 10z" fill="#FFFFFF" stroke="#344054" stroke-width="2"/><text x="900" y="430" font-family="sans-serif" font-size="11" fill="#344054">has 1..*</text>
  <path d="M680 560V680" fill="none" stroke="#344054" stroke-width="2"/><text x="690" y="625" font-family="sans-serif" font-size="11" fill="#344054">has</text>
  <path d="M1160 580V670" fill="none" stroke="#344054" stroke-width="2"/><text x="1170" y="630" font-family="sans-serif" font-size="11" fill="#344054">identified by</text>
  <!-- Legend -->
  <g><rect x="40" y="750" width="345" height="170" rx="6" fill="#F8FAFC" stroke="#D0D5DD"/><text x="58" y="777" font-family="sans-serif" font-size="13" font-weight="bold" fill="#171A20">UML symbol legend</text><path d="M58 804H110" stroke="#344054" stroke-width="2"/><path d="M72 804l14-10 14 10-14 10z" fill="#171A20"/><text x="125" y="809" font-family="sans-serif" font-size="12" fill="#344054">Composition</text><path d="M58 835H110" stroke="#344054" stroke-width="2"/><path d="M72 835l14-10 14 10-14 10z" fill="#FFFFFF" stroke="#344054" stroke-width="2"/><text x="125" y="840" font-family="sans-serif" font-size="12" fill="#344054">Aggregation</text><path d="M58 866H110" stroke="#344054" stroke-width="2" stroke-dasharray="5"/><text x="125" y="871" font-family="sans-serif" font-size="12" fill="#344054">Dependency</text></g>
</svg>

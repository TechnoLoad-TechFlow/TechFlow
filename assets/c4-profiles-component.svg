<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Profiles Management Bounded Context Component Diagram</title>
  <desc id="description">Diagrama de componentes por capas del contexto de perfiles.</desc>
  <rect width="1000" height="920" fill="#FFFFFF"/>
  <text x="500" y="38" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#000000">TechnoLoad - Profiles Management Bounded Context Component Diagram</text>
  <g><rect x="360" y="65" width="280" height="80" rx="8" fill="#438DD5"/><text x="380" y="90" font-family="sans-serif" font-size="11" fill="#FFFFFF">«container»</text><text x="500" y="116" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Single Page Application</text><text x="500" y="134" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#FFFFFF">[Angular]</text></g>
  <path d="M500 145V185" fill="none" stroke="#718096" stroke-width="2"/><path d="M500 185l-5-9h10z" fill="#718096"/>
  <g><rect x="170" y="185" width="660" height="640" rx="8" fill="none" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="6"/><text x="190" y="213" font-family="sans-serif" font-size="15" font-weight="bold" fill="#4A5568">Profiles Management</text><text x="190" y="231" font-family="sans-serif" font-size="12" fill="#4A5568">[bounded context]</text></g>
  <g><rect x="350" y="255" width="300" height="85" rx="6" fill="#63A0E1"/><text x="368" y="278" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component» · Interfaces Layer [Spring Web]</text><text x="368" y="306" font-family="sans-serif" font-size="12" fill="#EAF3FC">Exposes endpoints for profile and</text><text x="368" y="323" font-family="sans-serif" font-size="12" fill="#EAF3FC">organization information.</text></g>
  <path d="M500 340V375" fill="none" stroke="#718096" stroke-width="2"/><path d="M500 375l-5-9h10z" fill="#718096"/>
  <g><rect x="350" y="375" width="300" height="100" rx="6" fill="#63A0E1"/><text x="368" y="398" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component» · Application Layer [Spring Boot]</text><text x="368" y="426" font-family="sans-serif" font-size="12" fill="#EAF3FC">Coordinates profile creation and</text><text x="368" y="443" font-family="sans-serif" font-size="12" fill="#EAF3FC">update use cases.</text></g>
  <path d="M500 475V510" fill="none" stroke="#718096" stroke-width="2"/><path d="M500 510l-5-9h10z" fill="#718096"/>
  <g><rect x="200" y="510" width="280" height="85" rx="6" fill="#63A0E1"/><text x="218" y="533" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component» · Security Connector</text><text x="218" y="551" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Security]</text><text x="218" y="575" font-family="sans-serif" font-size="12" fill="#EAF3FC">Validates authenticated users</text><text x="218" y="590" font-family="sans-serif" font-size="12" fill="#EAF3FC">and permissions.</text></g>
  <g><rect x="520" y="510" width="280" height="85" rx="6" fill="#63A0E1"/><text x="538" y="533" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component» · Domain Layer [Java]</text><text x="538" y="560" font-family="sans-serif" font-size="12" fill="#EAF3FC">Contains the Profile aggregate and</text><text x="538" y="577" font-family="sans-serif" font-size="12" fill="#EAF3FC">profile business rules.</text></g>
  <path d="M340 595L430 635M660 595L570 635" fill="none" stroke="#718096" stroke-width="2"/><path d="M430 635l-10-1 6-8zM570 635l4-10 6 8z" fill="#718096"/>
  <g><rect x="350" y="635" width="300" height="85" rx="6" fill="#63A0E1"/><text x="368" y="658" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component» · Infrastructure Layer</text><text x="368" y="676" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Data JPA]</text><text x="368" y="703" font-family="sans-serif" font-size="12" fill="#EAF3FC">Provides persistence for profile and</text><text x="368" y="718" font-family="sans-serif" font-size="12" fill="#EAF3FC">organization information.</text></g>
  <path d="M500 720V750" fill="none" stroke="#718096" stroke-width="2"/><path d="M500 750l-5-9h10z" fill="#718096"/>
  <g><path d="M350 775C350 748 650 748 650 775V815C650 842 350 842 350 815z" fill="#438DD5"/><path d="M350 775C350 802 650 802 650 775M350 815C350 788 650 788 650 815" fill="none" stroke="#2F6EA9" stroke-width="2"/><text x="370" y="786" font-family="sans-serif" font-size="11" fill="#FFFFFF">«container»</text><text x="500" y="808" text-anchor="middle" font-family="sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">Database</text><text x="500" y="826" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">[Relational Database]</text></g>
  <text x="670" y="795" font-family="sans-serif" font-size="12" fill="#4A5568">Stores profile, contact and</text><text x="670" y="812" font-family="sans-serif" font-size="12" fill="#4A5568">organization information.</text>
</svg>

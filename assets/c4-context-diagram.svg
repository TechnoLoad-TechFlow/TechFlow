<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Software Architecture Context Diagram</title>
  <desc id="description">Modelo C4 nivel 1 con Fleet Administrator, Contractor Site Manager y TechnoLoad.</desc>
  <rect width="900" height="700" fill="#FFFFFF"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000">TechnoLoad - Software Architecture Context Diagram</text>

  <g>
    <rect x="60" y="90" width="340" height="200" rx="8" fill="#08427B"/>
    <text x="82" y="118" font-family="sans-serif" font-size="12" fill="#FFFFFF">«person»</text>
    <circle cx="230" cy="150" r="18" fill="#FFFFFF"/>
    <rect x="201" y="172" width="58" height="30" rx="15" fill="#FFFFFF"/>
    <text x="230" y="230" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Fleet Administrator</text>
    <text x="80" y="256" font-family="sans-serif" font-size="13" fill="#E2E8F0">Manages machinery, reservations, maintenance</text>
    <text x="80" y="276" font-family="sans-serif" font-size="13" fill="#E2E8F0">and operational information.</text>
  </g>

  <g>
    <rect x="500" y="90" width="340" height="200" rx="8" fill="#08427B"/>
    <text x="522" y="118" font-family="sans-serif" font-size="12" fill="#FFFFFF">«person»</text>
    <circle cx="670" cy="150" r="18" fill="#FFFFFF"/>
    <rect x="641" y="172" width="58" height="30" rx="15" fill="#FFFFFF"/>
    <text x="670" y="230" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Contractor / Site Manager</text>
    <text x="520" y="256" font-family="sans-serif" font-size="13" fill="#E2E8F0">Searches machinery, requests rentals and reviews</text>
    <text x="520" y="276" font-family="sans-serif" font-size="13" fill="#E2E8F0">service information.</text>
  </g>

  <line x1="230" y1="290" x2="380" y2="420" stroke="#718096" stroke-width="2"/>
  <path d="M380 420l-13-2 8-9z" fill="#718096"/>
  <text x="180" y="360" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4A5568">Manages fleet, reservations,</text>
  <text x="180" y="377" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4A5568">maintenance and operations</text>

  <line x1="670" y1="290" x2="520" y2="420" stroke="#718096" stroke-width="2"/>
  <path d="M520 420l5-13 8 9z" fill="#718096"/>
  <text x="520" y="360" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4A5568">Searches machinery, requests</text>
  <text x="520" y="377" font-family="sans-serif" font-size="12" font-weight="bold" fill="#4A5568">rentals and tracks services</text>

  <g>
    <rect x="280" y="420" width="340" height="220" rx="8" fill="#1168BD"/>
    <text x="302" y="450" font-family="sans-serif" font-size="12" fill="#FFFFFF">«system»</text>
    <text x="450" y="500" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">TechnoLoad</text>
    <text x="305" y="533" font-family="sans-serif" font-size="13" fill="#E2E8F0">Web platform for managing machinery rental operations,</text>
    <text x="305" y="553" font-family="sans-serif" font-size="13" fill="#E2E8F0">availability, reservations, maintenance and service</text>
    <text x="305" y="573" font-family="sans-serif" font-size="13" fill="#E2E8F0">execution.</text>
  </g>
</svg>

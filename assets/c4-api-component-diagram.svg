<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - API Application Component Diagram</title>
  <desc id="description">Modelo C4 nivel 3 con los bounded contexts de la REST API de TechnoLoad.</desc>
  <rect width="1100" height="900" fill="#FFFFFF"/>
  <text x="550" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000">TechnoLoad - API Application Component Diagram</text>

  <!-- SPA externa -->
  <g><rect x="620" y="70" width="280" height="110" rx="8" fill="#438DD5"/><text x="640" y="96" font-family="sans-serif" font-size="12" fill="#FFFFFF">«container»</text><text x="760" y="130" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Single Page Application</text><text x="760" y="154" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF">[Angular]</text></g>

  <!-- Boundary REST API -->
  <rect x="380" y="220" width="680" height="650" rx="8" fill="none" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="6"/>
  <text x="400" y="248" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4A5568">REST API</text><text x="400" y="266" font-family="sans-serif" font-size="12" fill="#4A5568">[container]</text>

  <!-- Relaciones SPA a contextos -->
  <path d="M760 180L500 260" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M500 260l8-8 3 10z" fill="#718096"/>
  <path d="M760 180L500 440" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M500 440l8-8 3 10z" fill="#718096"/>
  <path d="M760 180L740 440" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M740 440l-5-10h10z" fill="#718096"/>
  <path d="M760 180L620 610" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M620 610l4-10 7 8z" fill="#718096"/>
  <path d="M760 180L840 610" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M840 610l-9-7 9-4z" fill="#718096"/>
  <path d="M760 180L970 610" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M970 610l-10-3 7-7z" fill="#718096"/>
  <path d="M760 180L710 760" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M710 760l-5-10h10z" fill="#718096"/>
  <text x="770" y="205" font-family="sans-serif" font-size="11" fill="#4A5568">Uses [HTTPS / JSON]</text>

  <!-- Componentes -->
  <g><rect x="400" y="260" width="200" height="100" rx="6" fill="#63A0E1"/><text x="414" y="283" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component»</text><text x="500" y="307" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Operations Management</text><text x="500" y="325" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Boot]</text><text x="414" y="343" font-family="sans-serif" font-size="10" fill="#EAF3FC">Service execution, worked hours</text><text x="414" y="355" font-family="sans-serif" font-size="10" fill="#EAF3FC">and operational tracking.</text></g>
  <g><rect x="400" y="440" width="200" height="100" rx="6" fill="#63A0E1"/><text x="414" y="463" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component»</text><text x="500" y="487" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Rental Management</text><text x="500" y="505" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Boot]</text><text x="414" y="523" font-family="sans-serif" font-size="10" fill="#EAF3FC">Rental requests, reservations,</text><text x="414" y="535" font-family="sans-serif" font-size="10" fill="#EAF3FC">confirmations and cancellations.</text></g>
  <g><rect x="640" y="440" width="200" height="100" rx="6" fill="#63A0E1"/><text x="654" y="463" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component»</text><text x="740" y="487" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Maintenance Management</text><text x="740" y="505" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Boot]</text><text x="654" y="523" font-family="sans-serif" font-size="10" fill="#EAF3FC">Maintenance scheduling, history</text><text x="654" y="535" font-family="sans-serif" font-size="10" fill="#EAF3FC">and breakdown reports.</text></g>
  <g><rect x="520" y="610" width="200" height="100" rx="6" fill="#63A0E1"/><text x="534" y="633" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component»</text><text x="620" y="657" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Fleet Management</text><text x="620" y="675" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Boot]</text><text x="534" y="693" font-family="sans-serif" font-size="10" fill="#EAF3FC">Machinery inventory, status</text><text x="534" y="705" font-family="sans-serif" font-size="10" fill="#EAF3FC">and availability.</text></g>
  <g><rect x="740" y="610" width="200" height="100" rx="6" fill="#63A0E1"/><text x="754" y="633" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component»</text><text x="840" y="651" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Identity &amp; Access</text><text x="840" y="666" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Management</text><text x="840" y="683" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Boot]</text><text x="754" y="700" font-family="sans-serif" font-size="10" fill="#EAF3FC">Authentication, authorization,</text><text x="754" y="712" font-family="sans-serif" font-size="10" fill="#EAF3FC">user accounts and roles.</text></g>
  <g><rect x="870" y="610" width="170" height="100" rx="6" fill="#63A0E1"/><text x="882" y="633" font-family="sans-serif" font-size="10" fill="#FFFFFF">«component»</text><text x="955" y="651" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Profiles</text><text x="955" y="666" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">Management</text><text x="955" y="683" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#FFFFFF">[Spring Boot]</text><text x="882" y="700" font-family="sans-serif" font-size="9" fill="#EAF3FC">Profile, contact and</text><text x="882" y="711" font-family="sans-serif" font-size="9" fill="#EAF3FC">organization information.</text></g>
  <g><rect x="610" y="760" width="200" height="90" rx="6" fill="#63A0E1"/><text x="624" y="783" font-family="sans-serif" font-size="11" fill="#FFFFFF">«component»</text><text x="710" y="807" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Shared Bounded Context</text><text x="710" y="825" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#FFFFFF">[Spring Boot]</text><text x="624" y="842" font-family="sans-serif" font-size="10" fill="#EAF3FC">Common domain and application</text><text x="624" y="853" font-family="sans-serif" font-size="10" fill="#EAF3FC">elements shared across contexts.</text></g>

  <!-- Dependencias entre contextos -->
  <path d="M500 360V440" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M500 440l-5-9h10z" fill="#718096"/><text x="510" y="405" font-family="sans-serif" font-size="11" fill="#4A5568">Uses</text>
  <path d="M600 490H640" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M640 490l-9-5v10z" fill="#718096"/><text x="607" y="480" font-family="sans-serif" font-size="11" fill="#4A5568">Uses</text>
  <path d="M740 540L620 610" fill="none" stroke="#718096" stroke-width="1.5"/><path d="M620 610l4-10 7 8z" fill="#718096"/><text x="646" y="578" font-family="sans-serif" font-size="11" fill="#4A5568">Uses</text>

  <!-- Database -->
  <g><path d="M100 780C100 747 320 747 320 780V840C320 873 100 873 100 840z" fill="#438DD5"/><path d="M100 780C100 813 320 813 320 780" fill="none" stroke="#2F6EA9" stroke-width="2"/><path d="M100 840C100 807 320 807 320 840" fill="none" stroke="#2F6EA9" stroke-width="2"/><text x="118" y="795" font-family="sans-serif" font-size="11" fill="#FFFFFF">«container»</text><text x="210" y="819" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Database</text><text x="210" y="840" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#FFFFFF">[Relational Database]</text></g>
  <!-- Dependencias a base de datos -->
  <path d="M400 310L320 790M400 490L320 800M640 490L320 810M520 660L320 820M740 660L320 830M870 660L320 840M610 805L320 850" fill="none" stroke="#718096" stroke-width="1.2"/><text x="330" y="760" font-family="sans-serif" font-size="11" fill="#4A5568">Reads from and writes to</text>
</svg>

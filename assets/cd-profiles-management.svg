<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Profiles Management Bounded Context Class Diagram</title>
  <desc id="description">Diagrama UML de clases para el contexto de perfiles.</desc>
  <rect width="1400" height="1000" fill="#FFFFFF"/>
  <text x="700" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000">TechnoLoad - Profiles Management Bounded Context Class Diagram</text>
  <g><rect x="40" y="70" width="330" height="290" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="40" y="70" width="330" height="32" fill="#E8F2FF"/><text x="205" y="91" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">ProfilesManagementService</text><text x="205" y="118" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Application Service»</text><path d="M40 130H370" stroke="#1D2939"/><text x="55" y="155" font-family="sans-serif" font-size="12" fill="#171A20">+ createProfile()</text><text x="55" y="177" font-family="sans-serif" font-size="12" fill="#171A20">+ updateProfileInformation()</text><text x="55" y="199" font-family="sans-serif" font-size="12" fill="#171A20">+ updateContactInformation()</text><text x="55" y="221" font-family="sans-serif" font-size="12" fill="#171A20">+ updateOrganizationInformation()</text><text x="55" y="243" font-family="sans-serif" font-size="12" fill="#171A20">+ viewProfile()</text><text x="55" y="265" font-family="sans-serif" font-size="12" fill="#171A20">+ viewContactInformation()</text><text x="55" y="287" font-family="sans-serif" font-size="12" fill="#171A20">+ viewOrganizationInformation()</text></g>
  <g><rect x="40" y="450" width="330" height="220" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="40" y="450" width="330" height="32" fill="#F2F4F7"/><text x="205" y="471" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">ProfileRepository</text><text x="205" y="498" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Interface»</text><path d="M40 510H370" stroke="#1D2939"/><text x="55" y="535" font-family="sans-serif" font-size="12" fill="#171A20">+ save(profile)</text><text x="55" y="557" font-family="sans-serif" font-size="12" fill="#171A20">+ findById(id)</text><text x="55" y="579" font-family="sans-serif" font-size="12" fill="#171A20">+ findByUserAccountId(id)</text><text x="55" y="601" font-family="sans-serif" font-size="12" fill="#171A20">+ findByDocumentNumber(number)</text><text x="55" y="623" font-family="sans-serif" font-size="12" fill="#171A20">+ existsByDocumentNumber(number)</text></g>
  <g><rect x="480" y="130" width="390" height="460" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="480" y="130" width="390" height="32" fill="#FFF3C4"/><text x="675" y="151" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#171A20">Profile</text><text x="675" y="178" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Aggregate Root»</text><path d="M480 190H870" stroke="#1D2939"/><text x="496" y="214" font-family="sans-serif" font-size="12" fill="#171A20">- id: UUID</text><text x="496" y="236" font-family="sans-serif" font-size="12" fill="#171A20">- userAccountId: UUID</text><text x="496" y="258" font-family="sans-serif" font-size="12" fill="#171A20">- firstName: String</text><text x="496" y="280" font-family="sans-serif" font-size="12" fill="#171A20">- lastName: String</text><text x="496" y="302" font-family="sans-serif" font-size="12" fill="#171A20">- documentNumber: String</text><text x="496" y="324" font-family="sans-serif" font-size="12" fill="#171A20">- contactInformation: ContactInformation</text><text x="496" y="346" font-family="sans-serif" font-size="12" fill="#171A20">- organization: Organization</text><text x="496" y="368" font-family="sans-serif" font-size="12" fill="#171A20">- createdAt: LocalDateTime</text><text x="496" y="390" font-family="sans-serif" font-size="12" fill="#171A20">- updatedAt: LocalDateTime</text><path d="M480 405H870" stroke="#1D2939"/><text x="496" y="429" font-family="sans-serif" font-size="12" fill="#171A20">+ create()</text><text x="496" y="451" font-family="sans-serif" font-size="12" fill="#171A20">+ updatePersonalInformation()</text><text x="496" y="473" font-family="sans-serif" font-size="12" fill="#171A20">+ updateContactInformation()</text><text x="496" y="495" font-family="sans-serif" font-size="12" fill="#171A20">+ updateOrganizationInformation()</text><text x="496" y="517" font-family="sans-serif" font-size="12" fill="#171A20">+ fullName()</text></g>
  <g><rect x="1010" y="100" width="320" height="220" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="1010" y="100" width="320" height="32" fill="#E8F7ED"/><text x="1170" y="121" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">ContactInformation</text><text x="1170" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Value Object»</text><path d="M1010 160H1330" stroke="#1D2939"/><text x="1026" y="184" font-family="sans-serif" font-size="12" fill="#171A20">- phoneNumber: String</text><text x="1026" y="206" font-family="sans-serif" font-size="12" fill="#171A20">- secondaryEmail: String</text><text x="1026" y="228" font-family="sans-serif" font-size="12" fill="#171A20">- address: String · district: String</text><text x="1026" y="250" font-family="sans-serif" font-size="12" fill="#171A20">- city: String</text><path d="M1010 262H1330" stroke="#1D2939"/><text x="1026" y="286" font-family="sans-serif" font-size="12" fill="#171A20">+ isValid(): Boolean</text><text x="1026" y="308" font-family="sans-serif" font-size="12" fill="#171A20">+ formattedAddress()</text></g>
  <g><rect x="1010" y="400" width="320" height="210" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="1010" y="400" width="320" height="32" fill="#FFF3C4"/><text x="1170" y="421" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">Organization</text><text x="1170" y="448" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Entity»</text><path d="M1010 460H1330" stroke="#1D2939"/><text x="1026" y="484" font-family="sans-serif" font-size="12" fill="#171A20">- id: UUID · legalName: String</text><text x="1026" y="506" font-family="sans-serif" font-size="12" fill="#171A20">- tradeName: String · taxId: String</text><text x="1026" y="528" font-family="sans-serif" font-size="12" fill="#171A20">- type: OrganizationType</text><text x="1026" y="550" font-family="sans-serif" font-size="12" fill="#171A20">- address: String</text><path d="M1010 562H1330" stroke="#1D2939"/><text x="1026" y="586" font-family="sans-serif" font-size="12" fill="#171A20">+ updateInformation()</text><text x="1026" y="604" font-family="sans-serif" font-size="12" fill="#171A20">+ isValidTaxId()</text></g>
  <g><rect x="1010" y="700" width="330" height="150" fill="#FFFFFF" stroke="#1D2939" stroke-width="2"/><rect x="1010" y="700" width="330" height="32" fill="#F2F4F7"/><text x="1175" y="721" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#171A20">OrganizationType</text><text x="1175" y="748" text-anchor="middle" font-family="sans-serif" font-size="12" font-style="italic" fill="#475467">«Enum»</text><path d="M1010 760H1340" stroke="#1D2939"/><text x="1026" y="785" font-family="sans-serif" font-size="11" fill="#171A20">INDEPENDENT_CONTRACTOR · RENTAL_COMPANY</text><text x="1026" y="806" font-family="sans-serif" font-size="11" fill="#171A20">CONSTRUCTION_COMPANY · OTHER</text></g>
  <path d="M370 220L480 290" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="5"/><path d="M480 290l-11-1 7-8z" fill="#344054"/><text x="385" y="245" font-family="sans-serif" font-size="11" fill="#344054">uses</text><path d="M370 560L480 420" fill="none" stroke="#344054" stroke-width="2" stroke-dasharray="5"/><path d="M480 420l-5-10 10 4z" fill="#344054"/><text x="385" y="500" font-family="sans-serif" font-size="11" fill="#344054">persists</text>
  <path d="M870 325H980" fill="none" stroke="#344054" stroke-width="2"/><path d="M890 325l14-10 14 10-14 10z" fill="#171A20"/><text x="907" y="315" font-family="sans-serif" font-size="11" fill="#344054">contains 1</text>
  <path d="M870 505H980" fill="none" stroke="#344054" stroke-width="2"/><path d="M890 505l14-10 14 10-14 10z" fill="#FFFFFF" stroke="#344054" stroke-width="2"/><text x="895" y="495" font-family="sans-serif" font-size="11" fill="#344054">belongs to 0..1</text>
  <path d="M1170 610V700" fill="none" stroke="#344054" stroke-width="2"/><text x="1180" y="655" font-family="sans-serif" font-size="11" fill="#344054">classified as</text>
  <g><rect x="40" y="760" width="355" height="160" rx="6" fill="#F8FAFC" stroke="#D0D5DD"/><text x="58" y="787" font-family="sans-serif" font-size="13" font-weight="bold" fill="#171A20">UML symbol legend</text><path d="M58 816H110" stroke="#344054" stroke-width="2"/><path d="M72 816l14-10 14 10-14 10z" fill="#171A20"/><text x="125" y="821" font-family="sans-serif" font-size="12" fill="#344054">Composition</text><path d="M58 847H110" stroke="#344054" stroke-width="2"/><path d="M72 847l14-10 14 10-14 10z" fill="#FFFFFF" stroke="#344054" stroke-width="2"/><text x="125" y="852" font-family="sans-serif" font-size="12" fill="#344054">Aggregation</text><path d="M58 878H110" stroke="#344054" stroke-width="2" stroke-dasharray="5"/><text x="125" y="883" font-family="sans-serif" font-size="12" fill="#344054">Dependency</text></g>
</svg>

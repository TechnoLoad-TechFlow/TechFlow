<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Software Architecture Container Diagram</title>
  <desc id="description">Modelo C4 nivel 2 con usuarios, SPA Angular, REST API Spring Boot y base de datos relacional.</desc>
  <rect width="900" height="1100" fill="#FFFFFF"/>
  <text x="450" y="40" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000000">TechnoLoad - Software Architecture Container Diagram</text>

  <g><rect x="60" y="80" width="340" height="180" rx="8" fill="#08427B"/><text x="82" y="108" font-family="sans-serif" font-size="12" fill="#FFFFFF">«person»</text><circle cx="230" cy="140" r="17" fill="#FFFFFF"/><rect x="202" y="160" width="56" height="28" rx="14" fill="#FFFFFF"/><text x="230" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Fleet Administrator</text><text x="80" y="236" font-family="sans-serif" font-size="13" fill="#E2E8F0">Manages machinery, reservations, maintenance</text><text x="80" y="254" font-family="sans-serif" font-size="13" fill="#E2E8F0">and operational information.</text></g>
  <g><rect x="500" y="80" width="340" height="180" rx="8" fill="#08427B"/><text x="522" y="108" font-family="sans-serif" font-size="12" fill="#FFFFFF">«person»</text><circle cx="670" cy="140" r="17" fill="#FFFFFF"/><rect x="642" y="160" width="56" height="28" rx="14" fill="#FFFFFF"/><text x="670" y="212" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Contractor / Site Manager</text><text x="520" y="236" font-family="sans-serif" font-size="13" fill="#E2E8F0">Searches machinery, requests rentals and reviews</text><text x="520" y="254" font-family="sans-serif" font-size="13" fill="#E2E8F0">service information.</text></g>

  <rect x="200" y="310" width="500" height="750" rx="8" fill="none" stroke="#A0AEC0" stroke-width="2" stroke-dasharray="6"/>
  <text x="222" y="338" font-family="sans-serif" font-size="16" font-weight="bold" fill="#4A5568">TechnoLoad</text><text x="222" y="358" font-family="sans-serif" font-size="12" fill="#4A5568">[system]</text>

  <path d="M230 260L360 370" fill="none" stroke="#718096" stroke-width="2"/><path d="M360 370l-13-2 8-9z" fill="#718096"/><text x="160" y="308" font-family="sans-serif" font-size="12" fill="#4A5568">Uses [HTTPS]</text>
  <path d="M670 260L540 370" fill="none" stroke="#718096" stroke-width="2"/><path d="M540 370l5-13 8 9z" fill="#718096"/><text x="640" y="308" font-family="sans-serif" font-size="12" fill="#4A5568">Uses [HTTPS]</text>

  <g><rect x="240" y="370" width="420" height="180" rx="8" fill="#438DD5"/><text x="262" y="399" font-family="sans-serif" font-size="12" fill="#FFFFFF">«container»</text><text x="450" y="435" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">Single Page Application</text><text x="450" y="459" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF">[Angular]</text><text x="262" y="493" font-family="sans-serif" font-size="13" fill="#E2E8F0">Provides the user interface for fleet administrators and</text><text x="262" y="513" font-family="sans-serif" font-size="13" fill="#E2E8F0">contractors through a web browser.</text></g>
  <path d="M450 550V620" fill="none" stroke="#718096" stroke-width="2"/><path d="M450 620l-5-10h10z" fill="#718096"/><text x="465" y="589" font-family="sans-serif" font-size="12" fill="#4A5568">Uses [HTTPS / JSON]</text>
  <g><rect x="240" y="620" width="420" height="190" rx="8" fill="#438DD5"/><text x="262" y="649" font-family="sans-serif" font-size="12" fill="#FFFFFF">«container»</text><text x="450" y="686" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">REST API</text><text x="450" y="710" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF">[Spring Boot / Java]</text><text x="262" y="743" font-family="sans-serif" font-size="13" fill="#E2E8F0">Provides business capabilities for machinery, rentals,</text><text x="262" y="763" font-family="sans-serif" font-size="13" fill="#E2E8F0">maintenance, operations, profiles and identity management.</text></g>
  <path d="M450 810V880" fill="none" stroke="#718096" stroke-width="2"/><path d="M450 880l-5-10h10z" fill="#718096"/><text x="465" y="849" font-family="sans-serif" font-size="12" fill="#4A5568">Reads from and writes to</text><text x="465" y="866" font-family="sans-serif" font-size="12" fill="#4A5568">[Spring Data JPA]</text>
  <g><path d="M240 925C240 892 660 892 660 925V1015C660 1048 240 1048 240 1015z" fill="#438DD5"/><path d="M240 925C240 958 660 958 660 925" fill="none" stroke="#2F6EA9" stroke-width="2"/><path d="M240 1015C240 982 660 982 660 1015" fill="none" stroke="#2F6EA9" stroke-width="2"/><text x="262" y="924" font-family="sans-serif" font-size="12" fill="#FFFFFF">«container»</text><text x="450" y="958" text-anchor="middle" font-family="sans-serif" font-size="21" font-weight="bold" fill="#FFFFFF">Database</text><text x="450" y="981" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#FFFFFF">[Relational Database]</text><text x="290" y="1004" font-family="sans-serif" font-size="12" fill="#E2E8F0">Stores machinery, rental, maintenance, operational, account and profile information.</text></g>
</svg>

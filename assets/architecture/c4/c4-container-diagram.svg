<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 1150" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Software Architecture Container Diagram (C4 Level 2)</title>
  <desc id="description">Modelo C4 nivel 2 con usuarios, Landing Web Application (Vue + Vite), Single Page Application (Vue + PrimeVue), Backend API (ASP.NET Core / C#), Base de Datos PostgreSQL y sistemas externos.</desc>
  <rect width="1320" height="1150" fill="#F8FAFC"/>

  <text x="660" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">TechnoLoad - Software Architecture Container Diagram (C4 Level 2)</text>
  <text x="660" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Descomposición en contenedores de despliegue, tecnologías aplicadas e interacción de usuarios y servicios externos</text>

  <!-- ACTORS ROW (Top) -->
  <!-- 1. Public Visitor -->
  <g transform="translate(60, 90)">
    <rect width="210" height="120" rx="8" fill="#08427B"/>
    <text x="16" y="24" font-family="sans-serif" font-size="10.5" fill="#93C5FD">«person»</text>
    <circle cx="105" cy="46" r="13" fill="#FFFFFF"/>
    <rect x="85" y="62" width="40" height="18" rx="9" fill="#FFFFFF"/>
    <text x="105" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Public Visitor</text>
    <text x="105" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E2E8F0">Navega catálogo y portal</text>
  </g>

  <!-- 2. Fleet Administrator -->
  <g transform="translate(305, 90)">
    <rect width="225" height="120" rx="8" fill="#08427B"/>
    <text x="16" y="24" font-family="sans-serif" font-size="10.5" fill="#93C5FD">«person»</text>
    <circle cx="112" cy="46" r="13" fill="#FFFFFF"/>
    <rect x="92" y="62" width="40" height="18" rx="9" fill="#FFFFFF"/>
    <text x="112" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Fleet Administrator</text>
    <text x="112" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E2E8F0">Controla activos y taller</text>
  </g>

  <!-- 3. Contractor / Site Manager -->
  <g transform="translate(560, 90)">
    <rect width="225" height="120" rx="8" fill="#08427B"/>
    <text x="16" y="24" font-family="sans-serif" font-size="10.5" fill="#93C5FD">«person»</text>
    <circle cx="112" cy="46" r="13" fill="#FFFFFF"/>
    <rect x="92" y="62" width="40" height="18" rx="9" fill="#FFFFFF"/>
    <text x="112" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Contractor / Site Mgr</text>
    <text x="112" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E2E8F0">Alquila equipos en obra</text>
  </g>

  <!-- 4. Maintenance Technician -->
  <g transform="translate(815, 90)">
    <rect width="225" height="120" rx="8" fill="#08427B"/>
    <text x="16" y="24" font-family="sans-serif" font-size="10.5" fill="#93C5FD">«person»</text>
    <circle cx="112" cy="46" r="13" fill="#FFFFFF"/>
    <rect x="92" y="62" width="40" height="18" rx="9" fill="#FFFFFF"/>
    <text x="112" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Maintenance Tech</text>
    <text x="112" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E2E8F0">Registra horómetros</text>
  </g>

  <!-- 5. Operations Coordinator -->
  <g transform="translate(1065, 90)">
    <rect width="200" height="120" rx="8" fill="#08427B"/>
    <text x="16" y="24" font-family="sans-serif" font-size="10.5" fill="#93C5FD">«person»</text>
    <circle cx="100" cy="46" r="13" fill="#FFFFFF"/>
    <rect x="80" y="62" width="40" height="18" rx="9" fill="#FFFFFF"/>
    <text x="100" y="94" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Operations Coord</text>
    <text x="100" y="108" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#E2E8F0">Supervisa logística</text>
  </g>

  <!-- SYSTEM BOUNDARY: TECHNO LOAD -->
  <rect x="40" y="260" width="880" height="830" rx="12" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="60" y="288" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E293B">TechnoLoad</text>
  <text x="165" y="288" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748B">[Software System]</text>

  <!-- CONTAINER 1: LANDING WEB APPLICATION -->
  <g transform="translate(70, 320)">
    <rect width="250" height="180" rx="8" fill="#2563EB"/>
    <text x="16" y="24" font-family="sans-serif" font-size="11" fill="#BFDBFE">«container»</text>
    <text x="125" y="55" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Landing Web</text>
    <text x="125" y="73" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Application</text>
    <text x="125" y="95" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="600" fill="#93C5FD">[Vue 3 + Vite]</text>
    <text x="125" y="125" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#F1F5F9">Portal público de captación,</text>
    <text x="125" y="140" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#F1F5F9">catálogo comercial y llamadas</text>
    <text x="125" y="155" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#F1F5F9">a la acción (CTAs).</text>
  </g>

  <!-- CONTAINER 2: SINGLE PAGE APPLICATION -->
  <g transform="translate(370, 320)">
    <rect width="520" height="180" rx="8" fill="#2563EB"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#BFDBFE">«container»</text>
    <text x="260" y="58" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Single Page Application (SPA)</text>
    <text x="260" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#93C5FD">[Vue 3 + PrimeVue]</text>
    <text x="260" y="112" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">Interfaz web enriquecida para usuarios autenticados: gestión de flota,</text>
    <text x="260" y="130" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">solicitudes de alquiler, calendario de mantenimiento, reporte de averías,</text>
    <text x="260" y="148" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">registro de horómetros y administración de perfiles y usuarios.</text>
  </g>

  <!-- CONTAINER 3: BACKEND REST API -->
  <g transform="translate(200, 580)">
    <rect width="560" height="200" rx="8" fill="#1D4ED8"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#BFDBFE">«container»</text>
    <text x="280" y="60" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF">Backend REST API</text>
    <text x="280" y="84" text-anchor="middle" font-family="sans-serif" font-size="13.5" font-weight="600" fill="#93C5FD">[ASP.NET Core 8 / C#]</text>
    <text x="280" y="118" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">Servicios RESTful estructurados bajo Domain-Driven Design (DDD).</text>
    <text x="280" y="136" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">Expone endpoints para Identity, Profiles, Fleet, Rental, Maintenance</text>
    <text x="280" y="154" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">y Operations; gestiona autenticación JWT, eventos de dominio y reglas de negocio.</text>
  </g>

  <!-- CONTAINER 4: DATABASE -->
  <g transform="translate(290, 870)">
    <path d="M0 25 C0 0 380 0 380 25 V140 C380 165 0 165 0 140 Z" fill="#1E40AF"/>
    <path d="M0 25 C0 50 380 50 380 25" fill="none" stroke="#60A5FA" stroke-width="2"/>
    <text x="20" y="42" font-family="sans-serif" font-size="11" fill="#BFDBFE">«container»</text>
    <text x="190" y="75" text-anchor="middle" font-family="sans-serif" font-size="19" font-weight="bold" fill="#FFFFFF">Database</text>
    <text x="190" y="98" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#93C5FD">[PostgreSQL 16]</text>
    <text x="190" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Almacena información de cuentas, perfiles, maquinaria,</text>
    <text x="190" y="140" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">reservas de alquiler, órdenes de mantenimiento y registros de horas.</text>
  </g>

  <!-- EXTERNAL SYSTEMS COLUMN (Right) -->
  <!-- External 1: Payment Gateway -->
  <g transform="translate(980, 480)">
    <rect width="280" height="100" rx="8" fill="#64748B"/>
    <text x="16" y="22" font-family="sans-serif" font-size="10" fill="#E2E8F0">«external system»</text>
    <text x="140" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Payment Gateway</text>
    <text x="140" y="70" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#F1F5F9">Procesa cobros y pagos de alquileres</text>
  </g>

  <!-- External 2: Electronic Invoicing / SUNAT -->
  <g transform="translate(980, 620)">
    <rect width="280" height="100" rx="8" fill="#64748B"/>
    <text x="16" y="22" font-family="sans-serif" font-size="10" fill="#E2E8F0">«external system»</text>
    <text x="140" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Electronic Invoicing</text>
    <text x="140" y="63" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">/ SUNAT</text>
    <text x="140" y="82" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#F1F5F9">Emisión y validación tributaria CPE</text>
  </g>

  <!-- External 3: Notification Service -->
  <g transform="translate(980, 760)">
    <rect width="280" height="100" rx="8" fill="#64748B"/>
    <text x="16" y="22" font-family="sans-serif" font-size="10" fill="#E2E8F0">«external system»</text>
    <text x="140" y="50" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Notification Service</text>
    <text x="140" y="70" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#F1F5F9">Alertas por email y notificaciones push</text>
  </g>

  <!-- External 4: GPS / Telematics Provider -->
  <g transform="translate(980, 900)">
    <rect width="280" height="100" rx="8" fill="#64748B"/>
    <text x="16" y="22" font-family="sans-serif" font-size="10" fill="#E2E8F0">«external system»</text>
    <text x="140" y="45" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">GPS / Telematics</text>
    <text x="140" y="63" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Provider</text>
    <text x="140" y="82" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#F1F5F9">Lecturas IoT de horómetros y ubicación</text>
  </g>

  <!-- USER CONNECTIONS -->
  <!-- Public Visitor -> Landing -->
  <path d="M165 210 L165 320" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="165,320 160,308 170,308" fill="#475569"/>
  <text x="175" y="255" font-family="sans-serif" font-size="10" fill="#334155" font-weight="600">Uses [HTTPS]</text>

  <!-- Landing -> SPA (Redirects / CTA) -->
  <path d="M320 410 L370 410" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 3"/>
  <polygon points="370,410 360,405 360,415" fill="#3B82F6"/>
  <text x="345" y="398" text-anchor="middle" font-family="sans-serif" font-size="9.5" fill="#1E40AF" font-weight="600">Redirige CTA</text>

  <!-- Fleet Administrator -> SPA (DIRECT OPERATIONAL USE) -->
  <path d="M417 210 L450 320" fill="none" stroke="#08427B" stroke-width="2.5"/>
  <polygon points="450,320 440,311 448,307" fill="#08427B"/>
  <text x="438" y="250" font-family="sans-serif" font-size="10" fill="#08427B" font-weight="bold">Uses [HTTPS]</text>

  <!-- Fleet Administrator -> Landing (Secondary / Exploration) -->
  <path d="M330 210 L230 320" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="230,320 238,310 244,316" fill="#64748B"/>
  <text x="245" y="245" font-family="sans-serif" font-size="9" fill="#475569">Explora [HTTPS]</text>

  <!-- Contractor -> SPA (DIRECT OPERATIONAL USE) -->
  <path d="M672 210 L630 320" fill="none" stroke="#08427B" stroke-width="2.5"/>
  <polygon points="630,320 633,307 641,312" fill="#08427B"/>
  <text x="655" y="250" font-family="sans-serif" font-size="10" fill="#08427B" font-weight="bold">Uses [HTTPS]</text>

  <!-- Contractor -> Landing (Secondary / Exploration) -->
  <path d="M570 210 L280 320" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="280,320 291,315 296,322" fill="#64748B"/>
  <text x="340" y="275" font-family="sans-serif" font-size="9" fill="#475569">Explora ofertas [HTTPS]</text>

  <!-- Maintenance Tech -> SPA -->
  <path d="M927 210 L780 320" fill="none" stroke="#08427B" stroke-width="2.5"/>
  <polygon points="780,320 788,310 793,317" fill="#08427B"/>
  <text x="850" y="255" font-family="sans-serif" font-size="10" fill="#08427B" font-weight="bold">Uses [HTTPS]</text>

  <!-- Operations Coordinator -> SPA -->
  <path d="M1100 210 L850 320" fill="none" stroke="#08427B" stroke-width="2.5"/>
  <polygon points="850,320 859,311 864,318" fill="#08427B"/>
  <text x="965" y="280" font-family="sans-serif" font-size="10" fill="#08427B" font-weight="bold">Uses [HTTPS]</text>

  <!-- CONTAINER TO CONTAINER CONNECTIONS -->
  <!-- Landing -> Backend API -->
  <path d="M195 500 L260 580" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="260,580 250,572 257,566" fill="#475569"/>
  <text x="140" y="550" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Consulta catálogo público</text>
  <text x="140" y="563" font-family="sans-serif" font-size="10" fill="#475569">[HTTPS / JSON]</text>

  <!-- SPA -> Backend API -->
  <path d="M570 500 L530 580" fill="none" stroke="#475569" stroke-width="2.5"/>
  <polygon points="530,580 533,567 542,572" fill="#475569"/>
  <text x="565" y="540" font-family="sans-serif" font-size="11" fill="#334155" font-weight="bold">Realiza peticiones autenticadas JWT</text>
  <text x="565" y="555" font-family="sans-serif" font-size="10" fill="#475569">[HTTPS / JSON API]</text>

  <!-- Backend API -> Database -->
  <path d="M480 780 L480 870" fill="none" stroke="#475569" stroke-width="2.5"/>
  <polygon points="480,870 475,858 485,858" fill="#475569"/>
  <text x="495" y="820" font-family="sans-serif" font-size="11" fill="#334155" font-weight="bold">Lectura y persistencia de entidades</text>
  <text x="495" y="835" font-family="sans-serif" font-size="10.5" fill="#475569">[EF Core / TCP Port 5432]</text>

  <!-- BACKEND API TO EXTERNAL SYSTEMS -->
  <!-- API -> Payment Gateway -->
  <path d="M760 620 L980 540" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="980,540 968,542 971,549" fill="#475569"/>
  <text x="800" y="575" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Procesa pagos [HTTPS / REST]</text>

  <!-- API -> SUNAT -->
  <path d="M760 670 L980 670" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="980,670 968,665 968,675" fill="#475569"/>
  <text x="800" y="660" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Emisión de facturas [HTTPS / REST]</text>

  <!-- API -> Notification Service -->
  <path d="M760 720 L980 790" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="980,790 970,782 975,777" fill="#475569"/>
  <text x="800" y="750" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Envío de alertas [HTTPS / REST]</text>

  <!-- Telemetry -> API -->
  <path d="M980 940 L760 770" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="760,770 772,773 767,781" fill="#475569"/>
  <text x="800" y="870" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Ingesta de telemetría IoT [HTTPS Webhook]</text>

  <!-- Legend -->
  <g transform="translate(60, 1100)">
    <rect width="1200" height="40" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="20" y="12" width="16" height="16" rx="3" fill="#08427B"/>
    <text x="44" y="24" font-family="sans-serif" font-size="11" fill="#334155">Rol / Usuario (Person)</text>

    <rect x="220" y="12" width="16" height="16" rx="3" fill="#2563EB"/>
    <text x="244" y="24" font-family="sans-serif" font-size="11" fill="#334155">Contenedor Web (Frontend SPA / Landing)</text>

    <rect x="530" y="12" width="16" height="16" rx="3" fill="#1D4ED8"/>
    <text x="554" y="24" font-family="sans-serif" font-size="11" fill="#334155">Contenedor API (.NET)</text>

    <rect x="730" y="12" width="16" height="16" rx="3" fill="#1E40AF"/>
    <text x="754" y="24" font-family="sans-serif" font-size="11" fill="#334155">Base de Datos (PostgreSQL)</text>

    <rect x="940" y="12" width="16" height="16" rx="3" fill="#64748B"/>
    <text x="964" y="24" font-family="sans-serif" font-size="11" fill="#334155">Sistema Externo</text>
  </g>
</svg>

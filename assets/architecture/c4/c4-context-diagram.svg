<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Software Architecture Context Diagram (C4 Level 1)</title>
  <desc id="description">Modelo C4 nivel 1 con todos los actores de TechnoLoad y sistemas externos integrados.</desc>
  <rect width="1200" height="850" fill="#F8FAFC"/>
  
  <text x="600" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">TechnoLoad - Software Architecture Context Diagram (C4 Level 1)</text>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Delimitación del sistema SaaS central respecto a sus usuarios clave y sistemas externos de integración</text>

  <!-- ACTORS (Left & Top) -->
  <!-- 1. Fleet Administrator -->
  <g transform="translate(60, 90)">
    <rect width="250" height="130" rx="8" fill="#08427B"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#93C5FD">«person»</text>
    <circle cx="125" cy="50" r="14" fill="#FFFFFF"/>
    <rect x="103" y="68" width="44" height="20" rx="10" fill="#FFFFFF"/>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Fleet Administrator</text>
    <text x="125" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">Gestiona flota, tarifas y planes</text>
  </g>

  <!-- 2. Maintenance Technician -->
  <g transform="translate(60, 260)">
    <rect width="250" height="130" rx="8" fill="#08427B"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#93C5FD">«person»</text>
    <circle cx="125" cy="50" r="14" fill="#FFFFFF"/>
    <rect x="103" y="68" width="44" height="20" rx="10" fill="#FFFFFF"/>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Maintenance Technician</text>
    <text x="125" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">Registra horómetros y averías</text>
  </g>

  <!-- 3. Operations Coordinator -->
  <g transform="translate(60, 430)">
    <rect width="250" height="130" rx="8" fill="#08427B"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#93C5FD">«person»</text>
    <circle cx="125" cy="50" r="14" fill="#FFFFFF"/>
    <rect x="103" y="68" width="44" height="20" rx="10" fill="#FFFFFF"/>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Operations Coordinator</text>
    <text x="125" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">Supervisa horas y operaciones</text>
  </g>

  <!-- 4. Contractor / Site Manager -->
  <g transform="translate(60, 600)">
    <rect width="250" height="130" rx="8" fill="#08427B"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#93C5FD">«person»</text>
    <circle cx="125" cy="50" r="14" fill="#FFFFFF"/>
    <rect x="103" y="68" width="44" height="20" rx="10" fill="#FFFFFF"/>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Contractor / Site Manager</text>
    <text x="125" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">Reserva maquinaria y alquila</text>
  </g>

  <!-- 5. Public Visitor (Top Center-Left) -->
  <g transform="translate(445, 90)">
    <rect width="250" height="130" rx="8" fill="#08427B"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#93C5FD">«person»</text>
    <circle cx="125" cy="50" r="14" fill="#FFFFFF"/>
    <rect x="103" y="68" width="44" height="20" rx="10" fill="#FFFFFF"/>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Public Visitor</text>
    <text x="125" y="118" text-anchor="middle" font-family="sans-serif" font-size="10.5" fill="#E2E8F0">Explora catálogo y solicita info</text>
  </g>

  <!-- CENTRAL SYSTEM: TechnoLoad -->
  <g transform="translate(440, 310)">
    <rect width="320" height="270" rx="12" fill="#1168BD" stroke="#0B4D8C" stroke-width="2.5"/>
    <text x="24" y="32" font-family="sans-serif" font-size="12" fill="#93C5FD">«software system»</text>
    <text x="160" y="80" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">TechnoLoad</text>
    <text x="160" y="105" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#BFDBFE">[SaaS Platform]</text>
    <text x="160" y="145" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F8FAFC">Plataforma web integral para la gestión</text>
    <text x="160" y="165" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F8FAFC">inteligente de flotas de maquinaria pesada,</text>
    <text x="160" y="185" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F8FAFC">solicitudes de alquiler, control de mantenimiento</text>
    <text x="160" y="205" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F8FAFC">preventivo y liquidación de operaciones.</text>
    <text x="160" y="240" text-anchor="middle" font-family="sans-serif" font-size="11" font-style="italic" fill="#93C5FD">Vue 3 + PrimeVue · ASP.NET Core · PostgreSQL</text>
  </g>

  <!-- EXTERNAL SYSTEMS (Right) -->
  <!-- 1. Payment Gateway -->
  <g transform="translate(890, 90)">
    <rect width="250" height="130" rx="8" fill="#8C8C8C"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#E2E8F0">«external system»</text>
    <text x="125" y="65" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Payment Gateway</text>
    <text x="125" y="85" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">Procesa transacciones de pago</text>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">seguro para reservas y alquiler</text>
  </g>

  <!-- 2. Electronic Invoicing / SUNAT -->
  <g transform="translate(890, 260)">
    <rect width="250" height="130" rx="8" fill="#8C8C8C"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#E2E8F0">«external system»</text>
    <text x="125" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Electronic Invoicing</text>
    <text x="125" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">/ SUNAT</text>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Emisión fiscal y validación CPE</text>
  </g>

  <!-- 3. Notification Service -->
  <g transform="translate(890, 430)">
    <rect width="250" height="130" rx="8" fill="#8C8C8C"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#E2E8F0">«external system»</text>
    <text x="125" y="65" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Notification Service</text>
    <text x="125" y="85" text-anchor="middle" font-family="sans-serif" font-size="11.5" fill="#F1F5F9">Envío de alertas de averías,</text>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">correos y confirmaciones</text>
  </g>

  <!-- 4. GPS / Telematics Provider -->
  <g transform="translate(890, 600)">
    <rect width="250" height="130" rx="8" fill="#8C8C8C"/>
    <text x="20" y="24" font-family="sans-serif" font-size="11" fill="#E2E8F0">«external system»</text>
    <text x="125" y="60" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">GPS / Telematics</text>
    <text x="125" y="80" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">Provider</text>
    <text x="125" y="102" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F1F5F9">Lecturas IoT y geolocalización</text>
  </g>

  <!-- CONNECTORS -->
  <!-- Fleet Admin -> TechnoLoad -->
  <path d="M310 155 L440 350" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="440,350 430,342 436,336" fill="#475569"/>
  <text x="350" y="225" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Administra flota y</text>
  <text x="350" y="238" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">mantenimientos [HTTPS]</text>

  <!-- Technician -> TechnoLoad -->
  <path d="M310 325 L440 400" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="440,400 428,395 432,389" fill="#475569"/>
  <text x="325" y="350" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Registra partes de</text>
  <text x="325" y="363" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">trabajo y averías [HTTPS]</text>

  <!-- Coordinator -> TechnoLoad -->
  <path d="M310 495 L440 470" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="440,470 428,473 429,466" fill="#475569"/>
  <text x="320" y="475" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Supervisa horas y</text>
  <text x="320" y="488" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">operaciones [HTTPS]</text>

  <!-- Contractor -> TechnoLoad -->
  <path d="M310 665 L440 530" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="440,530 433,542 427,537" fill="#475569"/>
  <text x="340" y="615" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Consulta catálogo y</text>
  <text x="340" y="628" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">reserva alquiler [HTTPS]</text>

  <!-- Public Visitor -> TechnoLoad -->
  <path d="M570 220 L570 310" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="570,310 565,298 575,298" fill="#475569"/>
  <text x="578" y="265" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Visita portal público [HTTPS]</text>

  <!-- TechnoLoad -> Payment Gateway -->
  <path d="M760 360 L890 190" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="890,190 878,195 882,202" fill="#475569"/>
  <text x="790" y="250" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Procesa cobros y pagos</text>
  <text x="790" y="263" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">[HTTPS / REST]</text>

  <!-- TechnoLoad -> SUNAT -->
  <path d="M760 420 L890 350" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="890,350 878,351 881,358" fill="#475569"/>
  <text x="775" y="380" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Emite facturas y comprobantes</text>
  <text x="775" y="393" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">[HTTPS / REST]</text>

  <!-- TechnoLoad -> Notification Service -->
  <path d="M760 480 L890 480" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="890,480 878,475 878,485" fill="#475569"/>
  <text x="775" y="470" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Envía alertas y correos</text>
  <text x="775" y="500" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">[HTTPS / REST]</text>

  <!-- Telemetry -> TechnoLoad -->
  <path d="M890 640 L760 550" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="760,550 771,556 767,563" fill="#475569"/>
  <text x="780" y="595" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">Envía telemetría y ubicación</text>
  <text x="780" y="608" font-family="sans-serif" font-size="10.5" fill="#334155" font-weight="600">[HTTPS Webhook]</text>

  <!-- Legend -->
  <g transform="translate(60, 780)">
    <rect width="1080" height="46" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="25" y="15" width="16" height="16" rx="3" fill="#08427B"/>
    <text x="48" y="28" font-family="sans-serif" font-size="11.5" fill="#334155">Rol / Usuario (Person)</text>
    
    <rect x="230" y="15" width="16" height="16" rx="3" fill="#1168BD"/>
    <text x="253" y="28" font-family="sans-serif" font-size="11.5" fill="#334155">Sistema Software TechnoLoad</text>

    <rect x="500" y="15" width="16" height="16" rx="3" fill="#8C8C8C"/>
    <text x="523" y="28" font-family="sans-serif" font-size="11.5" fill="#334155">Sistema Externo (External System)</text>

    <line x1="770" y1="23" x2="815" y2="23" stroke="#475569" stroke-width="2"/>
    <polygon points="815,23 805,19 805,27" fill="#475569"/>
    <text x="825" y="28" font-family="sans-serif" font-size="11.5" fill="#334155">Relación / Flujo de comunicación</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 980" width="100%" height="100%" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad - Fleet Management Frontend Component Diagram (C4 Level 3)</title>
  <desc id="description">Diagrama de componentes Frontend para el contexto de gestión de flota en Vue 3 con nombres exactos de funciones y archivos de código.</desc>
  <rect width="1300" height="980" fill="#F8FAFC"/>

  <text x="650" y="38" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">TechnoLoad - Fleet Management Frontend Component Diagram (C4 Level 3)</text>
  <text x="650" y="60" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#64748B">Descomposición interna de la Single Page Application (Vue 3 + PrimeVue) para el módulo de inventario y maquinaria pesada</text>

  <!-- CONTAINER BOUNDARY: SPA -->
  <rect x="40" y="85" width="1220" height="760" rx="12" fill="none" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="60" y="115" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1E40AF">Single Page Application (SPA)</text>
  <text x="320" y="115" font-family="sans-serif" font-size="12" font-weight="600" fill="#64748B">[Container: Vue 3 + PrimeVue]</text>

  <!-- 1. PRESENTATION LAYER -->
  <rect x="65" y="135" width="1170" height="230" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
  <text x="85" y="160" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1D4ED8">Presentation Layer (Vue 3 Components &amp; PrimeVue UI)</text>

  <!-- Component 1: asset-list.vue -->
  <g transform="translate(85, 175)">
    <rect width="280" height="175" rx="6" fill="#2563EB"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#BFDBFE">«presentation component»</text>
    <text x="14" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#FFFFFF">asset-list.vue</text>
    <line x1="14" y1="52" x2="266" y2="52" stroke="#93C5FD" stroke-width="1"/>
    <text x="14" y="70" font-family="sans-serif" font-size="11" fill="#E2E8F0">Responsabilidad: Catálogo y lista de activos</text>
    <text x="14" y="90" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#BFDBFE">Funciones y métodos del componente:</text>
    <text x="14" y="108" font-family="monospace" font-size="10" fill="#FFFFFF">+ selectAsset(asset)</text>
    <text x="14" y="124" font-family="monospace" font-size="10" fill="#FFFFFF">+ onMounted() -> loadAssets()</text>
    <text x="14" y="140" font-family="monospace" font-size="10" fill="#FFFFFF">+ emit('select', asset)</text>
    <text x="14" y="156" font-family="monospace" font-size="10" fill="#FFFFFF">+ retryLoad()</text>
  </g>

  <!-- Component 2: asset-item.vue -->
  <g transform="translate(385, 175)">
    <rect width="250" height="175" rx="6" fill="#3B82F6"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#BFDBFE">«presentation component»</text>
    <text x="14" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#FFFFFF">asset-item.vue</text>
    <line x1="14" y1="52" x2="236" y2="52" stroke="#93C5FD" stroke-width="1"/>
    <text x="14" y="70" font-family="sans-serif" font-size="11" fill="#E2E8F0">Props: asset (Asset)</text>
    <text x="14" y="86" font-family="sans-serif" font-size="11" fill="#E2E8F0">Emits: @select(asset)</text>
    <text x="14" y="108" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#BFDBFE">Funciones:</text>
    <text x="14" y="126" font-family="monospace" font-size="10" fill="#FFFFFF">+ onCardClick()</text>
    <text x="14" y="142" font-family="monospace" font-size="10" fill="#FFFFFF">+ getStatusSeverity(status)</text>
    <text x="14" y="158" font-family="monospace" font-size="10" fill="#FFFFFF">+ formatHourlyRate(rate)</text>
  </g>

  <!-- Component 3: asset-summary.vue -->
  <g transform="translate(655, 175)">
    <rect width="255" height="175" rx="6" fill="#3B82F6"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#BFDBFE">«presentation component»</text>
    <text x="14" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#FFFFFF">asset-summary.vue</text>
    <line x1="14" y1="52" x2="241" y2="52" stroke="#93C5FD" stroke-width="1"/>
    <text x="14" y="70" font-family="sans-serif" font-size="11" fill="#E2E8F0">Responsabilidad: Tarjeta resumen KPI</text>
    <text x="14" y="90" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#BFDBFE">Funciones y métodos:</text>
    <text x="14" y="108" font-family="monospace" font-size="10" fill="#FFFFFF">+ calculateAvailableCount()</text>
    <text x="14" y="124" font-family="monospace" font-size="10" fill="#FFFFFF">+ calculateInMaintenance()</text>
    <text x="14" y="140" font-family="monospace" font-size="10" fill="#FFFFFF">+ calculateRentedCount()</text>
  </g>

  <!-- Component 4: PrimeVue Suite -->
  <g transform="translate(930, 175)">
    <rect width="285" height="175" rx="6" fill="#1E3A8A"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#93C5FD">«ui component suite»</text>
    <text x="14" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">PrimeVue UI Elements</text>
    <line x1="14" y1="52" x2="271" y2="52" stroke="#60A5FA" stroke-width="1"/>
    <text x="14" y="72" font-family="monospace" font-size="11" fill="#93C5FD">&lt;pv-button&gt;</text>
    <text x="14" y="92" font-family="monospace" font-size="11" fill="#93C5FD">&lt;pv-skeleton&gt;</text>
    <text x="14" y="112" font-family="monospace" font-size="11" fill="#93C5FD">&lt;pv-message&gt;</text>
    <text x="14" y="132" font-family="monospace" font-size="11" fill="#93C5FD">&lt;pv-card&gt; · &lt;pv-tag&gt;</text>
    <text x="14" y="152" font-family="monospace" font-size="11" fill="#93C5FD">&lt;pv-dialog&gt; · &lt;pv-data-table&gt;</text>
  </g>

  <!-- 2. APPLICATION LAYER -->
  <rect x="65" y="390" width="550" height="210" rx="8" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="85" y="415" font-family="sans-serif" font-size="13" font-weight="bold" fill="#15803D">Application Layer (State Store &amp; Orchestration)</text>

  <g transform="translate(85, 430)">
    <rect width="510" height="155" rx="6" fill="#16A34A"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#DCFCE7">«application store»</text>
    <text x="14" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#FFFFFF">fleet.store.js</text>
    <line x1="14" y1="50" x2="496" y2="50" stroke="#86EFAC" stroke-width="1"/>
    <text x="14" y="68" font-family="monospace" font-size="10.5" fill="#DCFCE7">State: assets, maintenanceOrders, selectedAsset, isLoading, errorMessage</text>
    <text x="14" y="88" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#DCFCE7">Funciones reactivas del Store:</text>
    <text x="14" y="106" font-family="monospace" font-size="10" fill="#FFFFFF">+ async loadAssets()</text>
    <text x="14" y="122" font-family="monospace" font-size="10" fill="#FFFFFF">+ async loadMaintenanceOrders()</text>
    <text x="14" y="138" font-family="monospace" font-size="10" fill="#FFFFFF">+ selectAsset(asset)  ·  + clearSelectedAsset()</text>
  </g>

  <!-- 3. DOMAIN LAYER -->
  <rect x="635" y="390" width="600" height="210" rx="8" fill="#FEFCE8" stroke="#FEF08A" stroke-width="1.5"/>
  <text x="655" y="415" font-family="sans-serif" font-size="13" font-weight="bold" fill="#A16207">Domain Layer (Entities &amp; Value Objects)</text>

  <g transform="translate(655, 430)">
    <rect width="275" height="155" rx="6" fill="#CA8A04"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#FEF9C3">«domain entity»</text>
    <text x="14" y="42" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF">asset.entity.js</text>
    <line x1="14" y1="50" x2="261" y2="50" stroke="#FDE047" stroke-width="1"/>
    <text x="14" y="68" font-family="monospace" font-size="10" fill="#FEF9C3">- id: string · - name: string</text>
    <text x="14" y="84" font-family="monospace" font-size="10" fill="#FEF9C3">- serialNumber: string · - status: string</text>
    <text x="14" y="100" font-family="monospace" font-size="10" fill="#FEF9C3">- hourMeter: number</text>
    <text x="14" y="122" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#FEF9C3">Métodos de negocio:</text>
    <text x="14" y="140" font-family="monospace" font-size="10" fill="#FFFFFF">+ isAvailable() · + requiresMaintenance()</text>
  </g>

  <g transform="translate(950, 430)">
    <rect width="265" height="155" rx="6" fill="#A16207"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#FEF9C3">«domain entity»</text>
    <text x="14" y="42" font-family="monospace" font-size="13" font-weight="bold" fill="#FFFFFF">maintenance-order.entity.js</text>
    <line x1="14" y1="50" x2="251" y2="50" stroke="#FDE047" stroke-width="1"/>
    <text x="14" y="68" font-family="monospace" font-size="10" fill="#FEF9C3">- id: string · - assetId: string</text>
    <text x="14" y="84" font-family="monospace" font-size="10" fill="#FEF9C3">- type: string · - status: string</text>
    <text x="14" y="100" font-family="monospace" font-size="10" fill="#FEF9C3">- scheduledDate: DateTime</text>
    <text x="14" y="122" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#FEF9C3">Métodos de negocio:</text>
    <text x="14" y="140" font-family="monospace" font-size="10" fill="#FFFFFF">+ isPending() · + complete()</text>
  </g>

  <!-- 4. INFRASTRUCTURE LAYER -->
  <rect x="65" y="625" width="1170" height="195" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="85" y="650" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">Infrastructure Layer (API Clients &amp; Assemblers)</text>

  <!-- fleet-api.js -->
  <g transform="translate(85, 665)">
    <rect width="360" height="140" rx="6" fill="#475569"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#CBD5E1">«infrastructure api client»</text>
    <text x="14" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#FFFFFF">fleet-api.js</text>
    <line x1="14" y1="50" x2="346" y2="50" stroke="#94A3B8" stroke-width="1"/>
    <text x="14" y="70" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#CBD5E1">Funciones cliente HTTP:</text>
    <text x="14" y="88" font-family="monospace" font-size="10" fill="#FFFFFF">+ getAssets(): Promise&lt;AssetResource[]&gt;</text>
    <text x="14" y="106" font-family="monospace" font-size="10" fill="#FFFFFF">+ getMaintenanceOrders(): Promise&lt;OrderResource[]&gt;</text>
    <text x="14" y="124" font-family="monospace" font-size="10" fill="#FFFFFF">+ postAsset(assetData): Promise&lt;AssetResource&gt;</text>
  </g>

  <!-- asset.assembler.js -->
  <g transform="translate(470, 665)">
    <rect width="350" height="140" rx="6" fill="#475569"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#CBD5E1">«infrastructure assembler»</text>
    <text x="14" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#FFFFFF">asset.assembler.js</text>
    <line x1="14" y1="50" x2="336" y2="50" stroke="#94A3B8" stroke-width="1"/>
    <text x="14" y="70" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#CBD5E1">Métodos de transformación de datos:</text>
    <text x="14" y="90" font-family="monospace" font-size="10" fill="#FFFFFF">+ toDomain(resource): Asset</text>
    <text x="14" y="110" font-family="monospace" font-size="10" fill="#FFFFFF">+ toDomainCollection(resources): Asset[]</text>
    <text x="14" y="130" font-family="monospace" font-size="10" fill="#FFFFFF">+ toDto(entity: Asset): object</text>
  </g>

  <!-- maintenance-order.assembler.js -->
  <g transform="translate(845, 665)">
    <rect width="370" height="140" rx="6" fill="#475569"/>
    <text x="14" y="22" font-family="sans-serif" font-size="10" fill="#CBD5E1">«infrastructure assembler»</text>
    <text x="14" y="42" font-family="monospace" font-size="14" font-weight="bold" fill="#FFFFFF">maintenance-order.assembler.js</text>
    <line x1="14" y1="50" x2="356" y2="50" stroke="#94A3B8" stroke-width="1"/>
    <text x="14" y="70" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#CBD5E1">Métodos de transformación de datos:</text>
    <text x="14" y="90" font-family="monospace" font-size="10" fill="#FFFFFF">+ toDomain(resource): MaintenanceOrder</text>
    <text x="14" y="110" font-family="monospace" font-size="10" fill="#FFFFFF">+ toDomainCollection(resources): MaintenanceOrder[]</text>
    <text x="14" y="130" font-family="monospace" font-size="10" fill="#FFFFFF">+ toDto(entity): object</text>
  </g>

  <!-- EXTERNAL BACKEND CONTAINER -->
  <g transform="translate(420, 875)">
    <rect width="480" height="85" rx="8" fill="#1D4ED8"/>
    <text x="20" y="22" font-family="sans-serif" font-size="10" fill="#BFDBFE">«external container»</text>
    <text x="240" y="46" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">Backend REST API [ASP.NET Core 8 / C#]</text>
    <text x="240" y="68" text-anchor="middle" font-family="monospace" font-size="11.5" fill="#BFDBFE">GET /api/v1/machinery  ·  GET /api/v1/maintenance-orders</text>
  </g>

  <!-- CONNECTORS -->
  <!-- asset-list -> asset-item -->
  <path d="M365 262 L385 262" stroke="#2563EB" stroke-width="2"/>
  <polygon points="385,262 377,258 377,266" fill="#2563EB"/>

  <!-- asset-list -> fleet.store.js -->
  <path d="M225 350 L260 430" stroke="#2563EB" stroke-width="2"/>
  <polygon points="260,430 252,420 259,417" fill="#2563EB"/>
  <text x="245" y="395" font-family="monospace" font-size="9" fill="#1D4ED8">loadAssets()</text>

  <!-- fleet.store.js -> fleet-api.js -->
  <path d="M260 585 L260 665" stroke="#16A34A" stroke-width="2"/>
  <polygon points="260,665 255,655 265,655" fill="#16A34A"/>
  <text x="268" y="628" font-family="monospace" font-size="9.5" fill="#15803D">getAssets()</text>

  <!-- fleet.store.js -> asset.assembler.js -->
  <path d="M430 585 L560 665" stroke="#16A34A" stroke-width="2"/>
  <polygon points="560,665 549,660 554,652" fill="#16A34A"/>
  <text x="510" y="628" font-family="monospace" font-size="9" fill="#15803D">toDomainCollection()</text>

  <!-- fleet-api.js -> Backend REST API -->
  <path d="M265 805 L440 875" stroke="#2563EB" stroke-width="2"/>
  <polygon points="440,875 428,873 432,866" fill="#2563EB"/>
  <text x="270" y="845" font-family="sans-serif" font-size="10" fill="#1D4ED8" font-weight="bold">HTTPS / JSON Request</text>
</svg>

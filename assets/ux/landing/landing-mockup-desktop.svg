<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title description">
  <title id="title">TechnoLoad Landing Page - Vista Desktop</title>
  <desc id="description">Mock-up de una página de aterrizaje para gestión de flotas, mantenimiento y rutas.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F3D5E"/><stop offset="1" stop-color="#071E30"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF8F00"/><stop offset="1" stop-color="#1976D2"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#08111C" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1440" height="960" fill="#F6F8FB"/>
  <rect width="1440" height="78" fill="#FFFFFF"/>
  <text x="104" y="48" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#0F3D5E">Techno<tspan fill="#FF8F00">Load</tspan></text>
  <text x="716" y="47" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52616B">Solución</text>
  <text x="815" y="47" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52616B">Beneficios</text>
  <text x="920" y="47" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52616B">Módulos</text>
  <text x="1004" y="47" font-family="Inter,Arial,sans-serif" font-size="15" fill="#52616B">Precios</text>
  <rect x="1128" y="20" width="204" height="40" rx="8" fill="#1976D2"/>
  <text x="1159" y="46" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Solicitar demo</text>

  <rect y="78" width="1440" height="426" fill="url(#hero)"/>
  <circle cx="1270" cy="158" r="118" fill="#1976D2" opacity=".14"/>
  <circle cx="1190" cy="442" r="172" fill="#FF8F00" opacity=".10"/>
  <text x="104" y="175" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="1.8" fill="#FFB34A">GESTIÓN INTELIGENTE DE FLOTAS</text>
  <text x="104" y="232" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700" fill="#FFFFFF">Controla tu flota antes de que</text>
  <text x="104" y="288" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700" fill="#FFB34A">una parada detenga tu operación.</text>
  <text x="104" y="331" font-family="Inter,Arial,sans-serif" font-size="18" fill="#DCE7F1">Mantenimiento por horómetro y kilometraje, activos conectados</text>
  <text x="104" y="358" font-family="Inter,Arial,sans-serif" font-size="18" fill="#DCE7F1">y rutas optimizadas en una sola plataforma.</text>
  <rect x="104" y="394" width="196" height="48" rx="8" fill="#FF8F00"/>
  <text x="133" y="425" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17212B">Solicitar demo</text>
  <rect x="316" y="394" width="190" height="48" rx="8" fill="none" stroke="#C8D8E8"/>
  <text x="345" y="425" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Conocer módulos</text>

  <g filter="url(#shadow)">
    <rect x="852" y="118" width="440" height="316" rx="16" fill="#FFFFFF"/>
    <rect x="852" y="118" width="440" height="50" rx="16" fill="#FFFFFF"/>
    <circle cx="882" cy="143" r="6" fill="#FF8F00"/><circle cx="902" cy="143" r="6" fill="#1976D2"/><circle cx="922" cy="143" r="6" fill="#2E7D32"/>
    <text x="954" y="149" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#17324D">Resumen operativo</text>
    <rect x="880" y="190" width="178" height="84" rx="10" fill="#EEF6FF"/>
    <text x="896" y="216" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52616B">FLOTA DISPONIBLE</text>
    <text x="896" y="255" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#0F3D5E">98%</text>
    <rect x="1078" y="190" width="184" height="84" rx="10" fill="#FFF5E5"/>
    <text x="1094" y="216" font-family="Inter,Arial,sans-serif" font-size="12" fill="#7C5310">PRÓXIMOS SERVICIOS</text>
    <text x="1094" y="255" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#D97706">12</text>
    <rect x="880" y="296" width="382" height="96" rx="10" fill="#F6F8FB"/>
    <path d="M902 359 C942 306 979 373 1020 334 S1094 301 1143 335 S1202 359 1242 320" fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="902" cy="359" r="7" fill="#1976D2"/><circle cx="1242" cy="320" r="7" fill="#FF8F00"/>
    <text x="902" y="317" font-family="Inter,Arial,sans-serif" font-size="12" fill="#52616B">Rutas activas y cumplimiento de entregas</text>
  </g>

  <text x="104" y="576" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#17324D">Todo lo que tu operación necesita</text>
  <text x="104" y="606" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52616B">Decide con datos, previene paradas y aprovecha cada unidad de tu flota.</text>
  <g filter="url(#shadow)">
    <rect x="104" y="646" width="372" height="194" rx="14" fill="#FFFFFF"/>
    <rect x="130" y="672" width="42" height="42" rx="10" fill="#FFF1DC"/>
    <text x="142" y="700" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#D97706">01</text>
    <text x="130" y="753" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Activos conectados</text>
    <text x="130" y="782" font-family="Inter,Arial,sans-serif" font-size="14" fill="#52616B">Conoce disponibilidad, kilometraje y horas</text>
    <text x="130" y="805" font-family="Inter,Arial,sans-serif" font-size="14" fill="#52616B">de uso de cada unidad.</text>

    <rect x="534" y="646" width="372" height="194" rx="14" fill="#FFFFFF"/>
    <rect x="560" y="672" width="42" height="42" rx="10" fill="#E8F2FF"/>
    <text x="572" y="700" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#1976D2">02</text>
    <text x="560" y="753" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Mantenimiento preventivo</text>
    <text x="560" y="782" font-family="Inter,Arial,sans-serif" font-size="14" fill="#52616B">Anticipa servicios críticos y reduce</text>
    <text x="560" y="805" font-family="Inter,Arial,sans-serif" font-size="14" fill="#52616B">costos por inactividad.</text>

    <rect x="964" y="646" width="372" height="194" rx="14" fill="#FFFFFF"/>
    <rect x="990" y="672" width="42" height="42" rx="10" fill="#E8F7ED"/>
    <text x="1002" y="700" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#2E7D32">03</text>
    <text x="990" y="753" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#17324D">Rutas optimizadas</text>
    <text x="990" y="782" font-family="Inter,Arial,sans-serif" font-size="14" fill="#52616B">Asigna unidades disponibles y mejora</text>
    <text x="990" y="805" font-family="Inter,Arial,sans-serif" font-size="14" fill="#52616B">la puntualidad de tus operaciones.</text>
  </g>
  <rect y="904" width="1440" height="56" fill="#0F3D5E"/>
  <text x="104" y="939" font-family="Inter,Arial,sans-serif" font-size="14" fill="#DCE7F1">© 2026 TechnoLoad · Control operativo que mueve tu negocio.</text>
</svg>
